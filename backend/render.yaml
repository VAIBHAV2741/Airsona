services:
  - type: web
    name: airsona-timeseries-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: WAQI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
