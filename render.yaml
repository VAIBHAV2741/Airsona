services:
  - type: web
    name: airsona-timeseries-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    pythonVersion: "3.11.9"

    buildCommand: pip install --prefer-binary -r requirements.txt

    startCommand: gunicorn main:app -w 2 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120

    envVars:
      - key: WAQI_API_KEY
        sync: false